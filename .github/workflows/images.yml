name: Hosted beta images

# Builds the two images the hosted beta runs (docs/beta-launch.md §10.6) and pushes them to ghcr.io, so the 2 GB server only pulls:
# `next build` on that server paged it to a standstill twice.
# Only `main` builds them (decided 2026-10-17): a push to any other branch used to overwrite `:beta`, so an unfinished branch was one
# `[deploy]` away from the live site.
# Since 2026-11-05 only after CI passed on that commit (docs/hosted-hardening.md §2): a commit that fails typecheck or the tests is never
# built, so `[deploy]` pulls the last good image instead. A dispatch builds the branch it is run on, for an emergency.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: crossline-assess
            file: apps/assess/Dockerfile
          - name: crossline-app
            file: deploy/app/Dockerfile
    steps:
      # The commit CI passed, not whatever `main` is by now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$owner/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:beta
            ${{ steps.tags.outputs.image }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
