name: Hosted beta server

# Reaches the hosted beta's host over SSH from a GitHub runner: the cloud sessions that drive the deploy have no outbound SSH
# (docs/beta-launch.md §10.6). Runs on dispatch, or on a push whose commit message carries [server] (diagnose) or [deploy]
# (pull the images and restart). Needs the repository secret DEPLOY_SSH_KEY (the private key for admin@ the host).
# Commit-message actions run only for pushes to `main` (decided 2026-10-17), so another branch can never deploy itself.
# Every day, and on `[backup]` or the `backup` dispatch, the newest server backup (deploy/server/backup.sh) is copied off the host,
# encrypted with the repository secret BACKUP_PASSPHRASE (AES-256, PBKDF2) and kept as a workflow artifact for 30 days.
#   Restore: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in crossline-backup.tgz.enc -out backup.tgz -pass pass:<passphrase>
on:
  push:
  schedule:
    - cron: "40 19 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: diagnose, deploy or backup
        default: diagnose

permissions:
  contents: read
  packages: read

env:
  HOST: 47.245.88.172

jobs:
  server:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[backup]') || contains(github.event.head_commit.message, '[server]') || contains(github.event.head_commit.message, '[deploy]') || contains(github.event.head_commit.message, '[codex-probe]') || contains(github.event.head_commit.message, '[migrate') || contains(github.event.head_commit.message, '[readiness]') || contains(github.event.head_commit.message, '[usage]')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$KEY" || { echo "DEPLOY_SSH_KEY is not set"; exit 1; }
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Diagnose
        run: |
          ssh -i ~/.ssh/id -o ConnectTimeout=30 -o ServerAliveInterval=15 admin@"$HOST" '
            uptime; printf "cpus: "; nproc; free -m; df -h / | tail -1
            sudo docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
            sudo docker images --format "{{.Repository}}:{{.Tag}} {{.Size}}" | head
            sudo systemctl is-active caddy
            tail -5 /tmp/build-app.log 2>/dev/null || true
            for p in 3340 3210; do printf "%s " $p; curl -s -m 5 -o /dev/null -w "%{http_code}\n" http://127.0.0.1:$p/ || echo down; done
            for c in assess crossline-web crossline-worker; do echo "== $c"; sudo docker logs --tail 40 $c 2>&1 || true; done
            echo "== memory"
            # Each container against its ceiling, whether one was killed for memory and how often it restarted, the worker peak, and the
            # model gate (runs waiting for the one slot, waits caused by memory) from the worker log.
            sudo docker stats --no-stream --format "{{.Name}} {{.MemUsage}} {{.MemPerc}} cpu {{.CPUPerc}}" || true
            for c in assess crossline-web crossline-worker; do printf "%s " $c; sudo docker inspect -f "oomkilled={{.State.OOMKilled}} restarts={{.RestartCount}} started={{.State.StartedAt}}" $c 2>/dev/null || echo missing; done
            printf "worker peak bytes: "; sudo docker exec crossline-worker cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unknown
            # What holds the worker memory: anonymous (processes) against file cache, then each process resident size and its name.
            sudo docker exec crossline-worker sh -c "grep -E \"^(anon|file|active_file|inactive_file|shmem) \" /sys/fs/cgroup/memory.stat" 2>/dev/null || true
            sudo docker exec crossline-worker sh -c "grep -H -E \"^(VmRSS|PPid)\" /proc/[0-9]*/status; grep -H . /proc/[0-9]*/comm" 2>/dev/null | head -90 || true
            sudo docker exec crossline-worker sh -c "for f in /proc/[0-9]*/cmdline; do echo \"\$f \$(tr \\\\0 \\  < \$f | cut -c1-160)\"; done" 2>/dev/null | head -30 || true
            sudo docker logs --since 24h crossline-worker 2>&1 | grep -E "worker.memory|model.gate|already_running" | tail -20 || true
            sudo docker logs --since 2h crossline-web 2>&1 | grep -E "web.timing|web.sections|web.queue" | tail -6 || true
            sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill" | tail -5 || true
            echo "== assess figures"
            # The app logs its image settings (provider, model, size; never the key) and every skipped, failed or drawn figure.
            sudo docker logs assess 2>&1 | grep -E "avatar\.|assess\.avatar|wants\." | tail -30 || true
            for k in ASSESS_IMAGE_PROVIDER ASSESS_IMAGE_MODEL ASSESS_IMAGE_SIZE ASSESS_IMAGE_BASE_URL ASSESS_IMAGE_DAILY_LIMIT ASSESS_IMAGE_API_KEY ASSESS_TEXT_BASE_URL ASSESS_TEXT_MODEL ASSESS_TEXT_API_KEY; do
              printf "%s: " $k
              if sudo grep -qE "^$k=.+" /srv/assess/assess.env; then echo filled; elif sudo grep -qE "^$k=" /srv/assess/assess.env; then echo empty; else echo absent; fi
            done
            printf "figures on disk: "; sudo ls /srv/assess/data/avatars 2>/dev/null | wc -l
            printf "image calls today: "; sudo cat /srv/assess/data/avatar-budget.json 2>/dev/null || echo none; echo
            echo "== mail"
            # Never prints a secret: PASSWORD lines are left out, and only whether one is filled in is counted.
            for f in /srv/crossline/app.env /srv/assess/assess.env; do echo "-- $f"; sudo grep -E "^(CROSSLINE|ASSESS)_(SMTP|MAIL)" $f | grep -v PASSWORD; printf "password filled: "; sudo grep -cE "^[A-Z_]+SMTP_PASSWORD=.+" $f || true; done
            for p in 465 587 2465; do printf "smtp.resend.com:%s " $p; timeout 8 bash -c "</dev/tcp/smtp.resend.com/$p" 2>/dev/null && echo open || echo blocked; done
            sudo docker logs crossline-web 2>&1 | grep -iE "mail|smtp|otp|EMAIL" | tail -20 || true
            echo "-- search and image for other models (names only; keys counted, never shown)"
            sudo grep -E "^(CROSSLINE_SEARCH_PROVIDER|CROSSLINE_IMAGE_API_STYLE|CROSSLINE_IMAGE_MODEL)=" /srv/crossline/app.env || true
            printf "keys filled: "; sudo grep -cE "^(TAVILY_API_KEY|BOCHA_API_KEY|CROSSLINE_IMAGE_API_KEY)=.+" /srv/crossline/app.env || true
            # The domains, and their status, held by the Resend account the configured key belongs to. The key never leaves the host.
            echo "-- resend domains for the configured key"
            key=$(sudo grep -E "^CROSSLINE_SMTP_PASSWORD=" /srv/crossline/app.env | cut -d= -f2-)
            curl -s -m 15 -H "Authorization: Bearer $key" https://api.resend.com/domains \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get(\"message\") or d.get(\"name\") or \"\"); [print(x.get(\"name\"), x.get(\"status\"), x.get(\"region\")) for x in d.get(\"data\",[])]" || true
            unset key
            echo "== codex"
            sudo docker exec crossline-worker /opt/codex/codex --version 2>&1 | tail -1 || true
            curl -s -m 10 http://127.0.0.1:3211/v1/codex/status | head -c 600; echo
            # OpenAI answers an unsupported region with 403 unsupported_country; 401 means reachable.
            for u in https://auth.openai.com/ https://api.openai.com/v1/models https://chatgpt.com/; do printf "%s " $u; curl -s -m 10 -o /tmp/oa -w "%{http_code} " $u; grep -o "unsupported_country[a-z_]*" /tmp/oa | head -1; echo; done'
      - name: Codex device-code probe
        if: contains(github.event.head_commit.message, '[codex-probe]')
        run: |
          # Starts a device-code login in a throwaway CODEX_HOME, waits for the one-time code, then kills it and deletes the home.
          # Only whether a code arrived is printed (the code itself is masked), so nothing in the log can be used to sign in.
          ssh -i ~/.ssh/id -o ConnectTimeout=30 admin@"$HOST" '
            sudo docker exec crossline-worker sh -c "
              home=\$(mktemp -d); CODEX_HOME=\$home timeout 40 /opt/codex/codex login --device-auth > \$home/out 2>&1; echo exit=\$?
              grep -oE \"https://[a-z.]+openai\.com[^ ]*\" \$home/out | head -2
              if grep -qE \"[A-Z0-9]{4}-[A-Z0-9]{4,5}\" \$home/out; then echo DEVICE_CODE_RECEIVED; else echo NO_CODE; sed -E \"s/[A-Z0-9]{4}-[A-Z0-9]{4,5}/XXXX-XXXX/g\" \$home/out | tail -15; fi
              rm -rf \$home"'
      - name: Start readiness and web errors
        if: contains(github.event.head_commit.message, '[readiness]')
        run: |
          # What each account still misses for the start standard, read from a copy of the ledger (the script refuses the live one),
          # and the web app's recent errors. Nothing is changed.
          ssh -i ~/.ssh/id -o ConnectTimeout=30 admin@"$HOST" 'sudo docker run --rm -v /srv/crossline/data:/live:ro -w /repo \
            $(sudo docker inspect -f "{{.Config.Image}}" crossline-web) sh -c "mkdir -p /tmp/copy && cp /live/crossline.db* /tmp/copy/ && \
            /repo/node_modules/.bin/tsx scripts/start-readiness.ts /tmp/copy/crossline.db"
            echo "== web errors"; sudo docker logs --since 2h crossline-web 2>&1 | grep -iE "error|unhandled|digest" | tail -30'
      - name: Model usage and repairs
        if: contains(github.event.head_commit.message, '[usage]')
        run: |
          # Every model run of the last two days from a copy of the ledger (time, repairs, error, tokens), and the worker's log lines
          # about rejected or repaired answers. Read-only.
          ssh -i ~/.ssh/id -o ConnectTimeout=30 admin@"$HOST" 'sudo docker run --rm -v /srv/crossline/data:/live:ro -w /repo \
            $(sudo docker inspect -f "{{.Config.Image}}" crossline-web) sh -c "mkdir -p /tmp/copy && cp /live/crossline.db* /tmp/copy/ && cd /repo/packages/db && node -e \"
              const D = require(\\\"better-sqlite3\\\"); const db = new D(\\\"/tmp/copy/crossline.db\\\", { readonly: true });
              const since = new Date(Date.now() - 2 * 86400000).toISOString();
              for (const r of db.prepare(\\\"SELECT at, skill, model, effort, ok, error_code, repairs, turns, duration_ms, output_tokens, reasoning_tokens FROM model_usage WHERE at >= ? ORDER BY at\\\").all(since))
                console.log([r.at.slice(5, 19), r.skill, r.model + \\\":\\\" + r.effort, r.ok ? \\\"ok\\\" : \\\"FAIL \\\" + r.error_code, \\\"repairs=\\\" + r.repairs, \\\"turns=\\\" + r.turns,
                  Math.round(r.duration_ms / 1000) + \\\"s\\\", \\\"out=\\\" + r.output_tokens, \\\"reason=\\\" + r.reasoning_tokens].join(\\\"  \\\"));
            \""
            echo "== worker repairs and rejections"; sudo docker logs --since 48h crossline-worker 2>&1 | grep -iE "repair|reject|invalid|blocked|stall|SKILL_" | cut -c1-400 | tail -40'
      - name: Migrate the owner's ledger
        if: contains(github.event.head_commit.message, '[migrate]') || contains(github.event.head_commit.message, '[migrate-apply]')
        env:
          APPLY: ${{ contains(github.event.head_commit.message, '[migrate-apply]') && '1' || '' }}
        run: |
          # Reads /tmp/crossline-transfer.tgz (scripts/pack-for-server.ts) and runs scripts/migrate-workspace.ts --replace in a one-off
          # container of the app image. [migrate] only previews. [migrate-apply] stops the app, copies the server ledger aside,
          # writes, and starts the app again — also when the write fails, so the site is never left down.
          ssh -i ~/.ssh/id -o ConnectTimeout=30 admin@"$HOST" "APPLY='$APPLY' sudo -E sh -s" <<'REMOTE'
          set -e
          test -f /tmp/crossline-transfer.tgz || { echo "no /tmp/crossline-transfer.tgz uploaded"; exit 1; }
          dir=/srv/crossline/import; rm -rf $dir; mkdir -p $dir; tar -xzf /tmp/crossline-transfer.tgz -C $dir; chown -R 1000:1000 $dir
          m() { python3 -c "import json,sys;print(json.load(open('$dir/manifest.json'))[sys.argv[1]])" "$1"; }
          ws=$(m workspaceId); from=$(m fromData); email=$(m toEmail)
          echo "workspace $ws  from $from  to $email"
          image=$(docker inspect -f '{{.Config.Image}}' crossline-web)
          migrate() {
            docker run --rm -v /srv/crossline/data:/data -v $dir:/import -w /repo "$image" /repo/node_modules/.bin/tsx scripts/migrate-workspace.ts \
              --from-db /import/crossline.db --from-data "$from" --workspace "$ws" --to-db /data/crossline.db --to-data /data \
              --files /import/files --to-email "$email" --replace "$@"
          }
          if [ -z "$APPLY" ]; then migrate; exit 0; fi
          docker stop crossline-worker crossline-web
          rm -f /srv/crossline/data/worker.lock
          stamp=$(date +%Y%m%d-%H%M%S); mkdir -p /srv/crossline/backups
          for f in crossline.db crossline.db-wal crossline.db-shm; do [ -f /srv/crossline/data/$f ] && cp -a /srv/crossline/data/$f /srv/crossline/backups/$f.$stamp; done
          echo "server ledger copied to /srv/crossline/backups/*.$stamp"
          status=0; migrate --apply || status=$?
          docker start crossline-web crossline-worker
          rm -f /tmp/crossline-transfer.tgz
          exit $status
          REMOTE
      - name: Deploy
        if: (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy') || contains(github.event.head_commit.message, '[deploy]')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # run.sh on the host is replaced by this commit's, which pulls from ghcr.io.
          scp -i ~/.ssh/id deploy/server/run.sh deploy/server/ensure-env.sh deploy/server/ensure-swap.sh deploy/server/set-secrets.sh deploy/server/backup.sh admin@"$HOST":/tmp/
          ssh -i ~/.ssh/id admin@"$HOST" 'sudo install -m 755 /tmp/run.sh /tmp/ensure-env.sh /tmp/ensure-swap.sh /tmp/set-secrets.sh /tmp/backup.sh /srv/crossline/ && sudo sh /srv/crossline/ensure-swap.sh && sudo sh /srv/crossline/ensure-env.sh'
          # The job's own token pulls the private images and is logged out again; nothing long-lived is left on the host.
          ssh -i ~/.ssh/id -o ConnectTimeout=30 -o ServerAliveInterval=15 admin@"$HOST" "
            echo '$TOKEN' | sudo docker login ghcr.io -u '$ACTOR' --password-stdin &&
            sudo sh /srv/crossline/run.sh; status=\$?; sudo docker logout ghcr.io; sudo docker image prune -f >/dev/null; exit \$status"
      - name: Daily backup and the cron entry
        if: (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy') || contains(github.event.head_commit.message, '[deploy]')
        run: |
          # After the containers are up again: installs the daily backup and makes the first one, so a deploy is never left without one.
          ssh -i ~/.ssh/id -o ConnectTimeout=30 admin@"$HOST" 'sudo sh /srv/crossline/backup.sh --install'
      - name: Copy the newest backup off the host
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'backup') || contains(github.event.head_commit.message, '[backup]')
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "BACKUP_PASSPHRASE is not set: nothing leaves the host unencrypted"; exit 1; }
          scp -i ~/.ssh/id deploy/server/backup.sh admin@"$HOST":/tmp/
          ssh -i ~/.ssh/id -o ConnectTimeout=30 admin@"$HOST" 'sudo install -m 755 /tmp/backup.sh /srv/crossline/ && sudo sh /srv/crossline/backup.sh'
          # The newest backup and the two env files (the server's secrets, needed to read the restored logins and stored keys), streamed
          # through openssl: the plaintext never touches the runner's disk.
          ssh -i ~/.ssh/id -o ConnectTimeout=30 -o ServerAliveInterval=15 admin@"$HOST" \
            'sudo tar -czf - -C /srv/backups --dereference latest -C /srv/crossline app.env -C /srv/assess assess.env' \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -out crossline-backup.tgz.enc
          ls -l crossline-backup.tgz.enc
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'backup') || contains(github.event.head_commit.message, '[backup]')
        with:
          name: crossline-backup-${{ github.run_id }}
          path: crossline-backup.tgz.enc
          retention-days: 30
